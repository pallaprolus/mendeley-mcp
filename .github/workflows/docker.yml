name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # Republish an already-released image, which is how an existing release picks
  # up a build change it was tagged before. Dispatch runs the workflow file from
  # the ref it is started on, so this is run from main and given the version to
  # rebuild; the release's own tag still has the older workflow.
  workflow_dispatch:
    inputs:
      version:
        description: 'Release to rebuild and republish, e.g. 0.5.0 (blank: build this ref as usual)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Build the release's own source, not main's, when republishing.
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref }}

      # Required to build the arm64 image on an amd64 runner. Costs little
      # here: every dependency installs from a prebuilt wheel on both
      # architectures, so emulation never has to compile anything.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,enable=${{ !inputs.version }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,enable=${{ !inputs.version }}
            type=raw,value=${{ inputs.version }},enable=${{ !!inputs.version }}
            type=raw,value=latest,enable=${{ !!inputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          # Apple Silicon is the common case for this project's users, and an
          # amd64-only manifest fails there with "no matching manifest".
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
